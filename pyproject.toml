[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "whois-mcp"
version = "0.2.0"
description = "Unofficial MCP server for .kr domain / IP WHOIS lookups via the KISA WHOIS API (data.go.kr)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SSH9753" }]
requires-python = ">=3.10"
keywords = ["mcp", "whois", "krnic", "threat-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/SSH9753/whois-mcp"

[project.scripts]
whois-mcp = "whois_mcp:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/whois_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
